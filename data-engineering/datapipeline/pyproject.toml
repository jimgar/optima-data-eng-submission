[project]
name = "grand-prix-stats-pipeline"
version = "0.1.0"
description = "Make yearly json summaries from csv race data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["solution/tests"]
pythonpath = ["solution"]
